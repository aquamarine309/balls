<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>球 Battle</title>
  
  <!-- HTML -->
  

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="game-container">
    <canvas></canvas>
    <div class="btns">
      <div class="btns">
        <div id="info"></div>
        <div id="loading">图片正在加载，请稍等</div>
        <div class="row">
          <input type="number" placeholder="修改种子" id="seed-input"><button id="load-seed">加载</button><button id="random-generate">随机生成</button>
        </div>
      </div>
      <hr>
      <h2>设置</h2>
      <div class="options">
        <div class="options-row">
          <button
            class="options-btn"
            id="same-ball"
            data-label="种类可重复"
          ></button>
          <button
            class="options-btn"
            id="ball-size"
            data-label="大小不同"
          ></button>
          <button
            class="options-btn"
            id="ball-info"
            data-label="显示进度条"
          ></button>
        </div>
      </div>
    </div>
  </div>
  <script src="main.js" type="module"></script>
</body>
</html>
